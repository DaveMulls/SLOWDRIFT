name: Build firmware

on:
  push:
  workflow_dispatch:

env:
  # CHANGE THIS to the name of the folder your main.cpp and Makefile live in.
  PEDAL_DIR: your_pedal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install ARM compiler
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          # Pinned to the release Electrosmith targets. Newer compilers reject
          # DaisySP's sources over missing <limits> includes.
          release: '10.3-2021.10'

      - name: Fetch Daisy libraries if they are missing
        run: |
          if [ ! -f libDaisy/Makefile ]; then
            git clone --depth 1 --recursive https://github.com/electro-smith/libDaisy
          fi
          if [ ! -f DaisySP/Makefile ]; then
            git clone --depth 1 --recursive https://github.com/electro-smith/DaisySP
          fi

      - name: Add missing <limits> includes
        # Harmless on the pinned compiler; keeps the build working if the
        # toolchain is ever bumped.
        run: |
          for f in $(grep -rl 'numeric_limits' DaisySP/Source libDaisy/src 2>/dev/null); do
            grep -q '#include <limits>' "$f" || sed -i '1i #include <limits>' "$f"
          done

      - name: Build libDaisy
        run: make -C libDaisy -j4

      - name: Build DaisySP
        run: make -C DaisySP -j4

      - name: Build the pedal
        run: make -C "$PEDAL_DIR" -j4

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: firmware
          path: |
            ${{ env.PEDAL_DIR }}/build/*.bin
            ${{ env.PEDAL_DIR }}/build/*.elf
          if-no-files-found: error
